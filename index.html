<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0221">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OVERDRIVE 89</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>

<!-- เมนูก่อนเข้าเกม (ลอจิกอยู่ใน menu.js) -->
<div id="menu">
  <h1 id="menu-title">OVERDRIVE 89</h1>
  <div class="sub">NEON RACING ONLINE</div>
  <button class="mbtn" id="btn-trial">ทดลองเล่น</button>
  <button class="mbtn" id="btn-email">เชื่อมอีเมล</button>
  <div id="email-box">
    <input id="email-input" type="email" inputmode="email" autocomplete="email" placeholder="อีเมลของคุณ">
    <button class="mbtn" id="email-send">ส่งลิงก์ยืนยัน</button>
    <div id="email-msg"></div>
    <button class="linkbtn" id="email-cancel">ยกเลิก</button>
  </div>
  <div id="menu-status"></div>
  <button class="linkbtn" id="btn-logout" style="display:none">ออกจากระบบ</button>
</div>

<!-- หน้าจอระหว่างเล่น (ลอจิกอยู่ใน ui.js / input.js) -->
<div id="hud">LV <b id="lv">1</b> EXP <b id="exp">0</b> ¢ <b id="coin">0</b> LAP <b id="lap">-</b>
  <button id="up">เครื่องยนต์</button><button id="fs">⛶</button></div>
<div id="warn"></div>
<div id="state"></div>
<canvas id="mm" width="400" height="240"></canvas>
<div class="pad" id="l"><div id="left"></div><div id="right"></div></div>
<div class="pad" id="r"><div class="zone" id="brk"></div><div class="zone" id="drift"></div><div class="zone" id="gas"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>

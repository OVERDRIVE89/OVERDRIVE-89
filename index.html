<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0221">
<title>OVERDRIVE 89</title>
<style>
  *{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:#0d0221;overflow:hidden;touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0}
  #hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:14px;align-items:center;
    padding:8px 12px;color:#05d9e8;font:bold 14px monospace;text-shadow:0 0 8px #05d9e8;z-index:3;pointer-events:none}
  #hud b{color:#ff2a6d;text-shadow:0 0 8px #ff2a6d}
  #up{margin-left:auto;pointer-events:auto;background:#261447;color:#f9c80e;border:2px solid #f9c80e;
    border-radius:8px;padding:8px 12px;font:bold 13px monospace}
  .pad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0));display:flex;gap:12px;z-index:3}
  #l{left:14px}#r{right:14px}
  .btn{width:76px;height:76px;border-radius:50%;background:rgba(38,20,71,.75);border:3px solid #05d9e8;
    color:#05d9e8;font:bold 26px monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
  .btn.on{background:#05d9e8;color:#0d0221}
  #gas{border-color:#ff2a6d;color:#ff2a6d;font-size:15px}#gas.on{background:#ff2a6d;color:#0d0221}
  #brk{font-size:15px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">LV <b id="lv">1</b> EXP <b id="exp">0</b> ¢ <b id="coin">0</b> LAP <b id="lap">-</b>
  <button id="up">เครื่องยนต์ Lv1 (50¢)</button></div>
<div class="pad" id="l"><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div></div>
<div class="pad" id="r"><div class="btn" id="gas">GAS</div><div class="btn" id="brk">BRK</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
// ---------- เซฟข้อมูลในเครื่อง (ต่อเซิร์ฟเวอร์ทีหลัง) ----------
const KEY = 'overdrive89_save';
let save = { level: 1, exp: 0, coins: 0, engine: 1 };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
const expNeeded = lv => 100 + lv * 50;
const upCost = () => 50 * save.engine;
const $ = id => document.getElementById(id);

function refreshHud() {
  $('lv').textContent = save.level; $('exp').textContent = save.exp + '/' + expNeeded(save.level);
  $('coin').textContent = save.coins; $('up').textContent = `เครื่องยนต์ Lv${save.engine} (${upCost()}¢)`;
}
$('up').addEventListener('pointerdown', () => {
  if (save.coins >= upCost()) { save.coins -= upCost(); save.engine++; persist(); refreshHud(); }
});

// ---------- ปุ่มสัมผัส (รองรับหลายนิ้วพร้อมกัน) ----------
const input = { left: false, right: false, gas: false, brk: false };
for (const k of ['left', 'right', 'gas', 'brk']) {
  const el = $(k);
  const set = v => e => { e.preventDefault(); input[k] = v; el.classList.toggle('on', v); };
  el.addEventListener('pointerdown', set(true));
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, set(false)));
}

// ---------- เกม ----------
const W = 1600, H = 900, K = 1.667, ROAD = 110;   // มองเห็นสนามทั้งหมดในจอ ไม่ซูมตามรถ
// จุดควบคุมของสนาม (วาดในพื้นที่ 960x540 แล้วขยาย) มีโค้งหักและเลี้ยวต่อเนื่องหลายช่วง
const CTRL = [[480,470],[700,475],[860,440],[900,330],[800,250],[680,300],[600,230],[700,130],
  [800,70],[540,70],[420,150],[300,80],[140,70],[70,180],[160,270],[300,320],[330,430]]
  .map(([x, y]) => ({ x: x * K, y: y * K }));

function buildTrack(pts, steps = 14) {            // Catmull-Rom แบบวงปิด
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let j = 0; j < steps; j++) {
      const t = j / steps, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  return out;
}
const TRACK = buildTrack(CTRL), N = TRACK.length;

class Race extends Phaser.Scene {
  create() {
    const g = this.add.graphics();
    g.fillStyle(0x0d0221).fillRect(0, 0, W, H);
    g.lineStyle(1, 0x1b0d3a);
    for (let x = 0; x <= W; x += 100) g.lineBetween(x, 0, x, H);
    for (let y = 0; y <= H; y += 100) g.lineBetween(0, y, W, y);
    g.lineStyle(ROAD + 14, 0x05d9e8).strokePoints(TRACK, true, true);   // ขอบนีออน
    g.lineStyle(ROAD, 0x261447).strokePoints(TRACK, true, true);        // ผิวถนน
    // เส้นสตาร์ท
    const a = TRACK[0], b = TRACK[1], ang = Math.atan2(b.y - a.y, b.x - a.x);
    const nx = -Math.sin(ang) * ROAD / 2, ny = Math.cos(ang) * ROAD / 2;
    g.lineStyle(6, 0xffffff).lineBetween(a.x - nx, a.y - ny, a.x + nx, a.y + ny);

    this.car = this.add.rectangle(a.x + Math.cos(ang) * 40, a.y + Math.sin(ang) * 40, 44, 22, 0xf9c80e)
      .setStrokeStyle(3, 0xff2a6d).setRotation(ang);
    this.v = 0; this.idx = 0; this.laps = 0; this.lapStart = 0; this.half = false;
    this.kb = this.input.keyboard.createCursorKeys();
    refreshHud();
  }
  update(_, dt) {
    const s = dt / 1000, k = this.kb, top = 330 + save.engine * 45;
    const gas = input.gas || k.up.isDown, brk = input.brk || k.down.isDown;
    const steer = (input.right || k.right.isDown ? 1 : 0) - (input.left || k.left.isDown ? 1 : 0);
    this.v += (gas ? 230 + save.engine * 30 : brk ? -360 : -120) * s;
    this.v = Phaser.Math.Clamp(this.v, 0, top);
    this.car.rotation += steer * 2.4 * s * Math.min(1, this.v / 180);
    this.car.x += Math.cos(this.car.rotation) * this.v * s;
    this.car.y += Math.sin(this.car.rotation) * this.v * s;

    // หาจุดบนสนามที่ใกล้รถที่สุด: ใช้ทั้งเช็คนอกถนนและนับรอบ
    let best = 0, bd = Infinity;
    for (let i = 0; i < N; i++) {
      const d = (TRACK[i].x - this.car.x) ** 2 + (TRACK[i].y - this.car.y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    if (Math.sqrt(bd) > ROAD / 2) this.v *= 0.96;      // ออกนอกถนน = ช้าลง

    const prev = this.idx; this.idx = best;
    if (best > N * 0.4 && best < N * 0.6) this.half = true;           // ผ่านครึ่งทางแล้ว
    if (this.half && prev > N * 0.9 && best < N * 0.1) {              // ข้ามเส้นสตาร์ทตามทิศทางถูก
      if (this.laps > 0) this.finishLap((this.time.now - this.lapStart) / 1000);
      this.laps++; this.lapStart = this.time.now; this.half = false;
    } else if (this.laps === 0 && prev > N * 0.9 && best < N * 0.1) {
      this.laps = 1; this.lapStart = this.time.now; this.half = false;
    }
    if (this.laps > 0) $('lap').textContent = ((this.time.now - this.lapStart) / 1000).toFixed(1) + 's';
  }
  finishLap(sec) {
    if (sec < 10) return;
    save.exp += Math.max(20, Math.round(200 - sec * 2)); save.coins += 40;
    while (save.exp >= expNeeded(save.level)) { save.exp -= expNeeded(save.level); save.level++; }
    persist(); refreshHud();
  }
}

new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#0d0221',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Race
});
</script>
</body>
</html>
